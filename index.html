<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Under Maintenance</title>
<style>
:root {
  --primary: #6366f1;
  --primary-dark: #4f46e5;
  --text: #1f2937;
  --light: #f9fafb;
  --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f3 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  margin: 0;
}

.card {
  background: white;
  border-radius: 16px;
  box-shadow: var(--shadow);
  padding: 3rem;
  max-width: 480px;
  width: 100%;
  text-align: center;
  animation: fadeInUp 0.8s ease-out;
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

h1 {
  color: var(--text);
  font-size: 2.5rem;
  margin-bottom: 1rem;
  font-weight: 800;
}

p {
  color: #6b7280;
  font-size: 1.125rem;
  line-height: 1.6;
  margin-bottom: 2rem;
}

.logo {
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 2rem;
  display: inline-block;
}

.logo span {
  color: var(--text);
}

@media (max-width: 640px) {
  .card {
    padding: 2rem;
  }
  
  h1 {
    font-size: 2rem;
  }
}
</style>
</head>
<body>
<div class="card">
  <div class="logo">GIAMEDICAL <span>Maintenance</span></div>
  <h1>We're making improvements</h1>
  <p>Our website is currently undergoing scheduled maintenance. We'll be back online shortly with better performance and new features.</p>
  <p style="font-size: 0.9rem; margin-bottom: 0;">Thank you for your patience.</p>
</div>
</body>
</html>
